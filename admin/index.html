<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPHYNX MOTION · Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#08080A; --surface:#111114; --surface2:#1A1A1F; --border:rgba(255,255,255,.08);
      --text:#F0F0F2; --text-dim:#9090A0; --text-faint:#55555F;
      --red:#E61E24; --red-dark:#8B0F14; --danger:#FF453A; --success:#30D158;
    }
    body { background:var(--bg); font-family:'Space Grotesk',system-ui,sans-serif; color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .wrap { width:100%; max-width:400px; }
    .logo { text-align:center; margin-bottom:32px; }
    .logo-text { font-size:28px; font-weight:800; letter-spacing:.04em; }
    .logo-text span { color:var(--red); }
    .logo-sub { font-size:11px; color:var(--text-faint); letter-spacing:.14em; text-transform:uppercase; margin-top:4px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 24px; }
    h1 { font-size:18px; font-weight:700; margin-bottom:4px; }
    p  { font-size:12px; color:var(--text-dim); margin-bottom:24px; }
    label { display:block; font-size:11px; font-weight:700; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
    input { display:block; width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:14px; color:var(--text); font-family:inherit; outline:none; margin-bottom:16px; transition:border-color .15s; }
    input:focus { border-color:var(--red); }
    input.error  { border-color:var(--danger); }
    .btn { display:block; width:100%; background:var(--red); color:#fff; border:none; border-radius:12px; padding:14px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; letter-spacing:.03em; transition:opacity .15s; }
    .btn:hover { opacity:.88; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    #errMsg { display:none; font-size:12px; color:var(--danger); text-align:center; margin-top:12px; }
    #successMsg { display:none; font-size:12px; color:var(--success); text-align:center; margin-top:12px; }
    .footer { text-align:center; margin-top:20px; font-size:11px; color:var(--text-faint); }
    .footer a { color:var(--text-dim); text-decoration:none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-text">SPHYNX <span>MOTION</span></div>
    <div class="logo-sub">Admin Portal</div>
  </div>

  <div class="card">
    <h1>Sign in to Admin</h1>
    <p>Admin and superadmin accounts only. Access is verified server-side.</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@sphynxmotion.com" autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')login()">

    <button class="btn" id="loginBtn" onclick="login()">Sign In →</button>

    <div id="errMsg"></div>
    <div id="successMsg">Signed in — redirecting…</div>
  </div>

  <div class="footer">
    <a href="/">← Back to SPHYNX MOTION</a>
  </div>
</div>

<script>
  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const errMsg   = document.getElementById('errMsg');
    const okMsg    = document.getElementById('successMsg');

    errMsg.style.display = 'none';
    okMsg.style.display  = 'none';

    if (!email || !password) {
      showErr('Please enter your email and password.');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Signing in…';

    try {
      const res  = await fetch('/api/admin/auth/login', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'include',
        body:        JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showErr(data.error || 'Login failed.');
        return;
      }

      okMsg.style.display = 'block';
      setTimeout(() => { window.location.href = '/admin/dashboard'; }, 800);

    } catch (e) {
      showErr('Could not reach the server. Is the backend running?');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Sign In →';
    }
  }

  function showErr(msg) {
    const el = document.getElementById('errMsg');
    el.textContent    = msg;
    el.style.display  = 'block';
    document.getElementById('password').classList.add('error');
    setTimeout(() => { document.getElementById('password').classList.remove('error'); }, 2400);
  }
</script>
</body>
</html>
