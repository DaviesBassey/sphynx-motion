<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPHYNX MOTION · Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#08080A; --surface:#111114; --surface2:#1A1A1F; --border:rgba(255,255,255,.08);
      --text:#F0F0F2; --text-dim:#9090A0; --text-faint:#55555F;
      --red:#E61E24; --red-dark:#8B0F14; --danger:#FF453A; --success:#30D158;
    }
    body { background:var(--bg); font-family:'Space Grotesk',system-ui,sans-serif; color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .wrap { width:100%; max-width:400px; }
    .logo { text-align:center; margin-bottom:32px; }
    .logo-text { font-size:28px; font-weight:800; letter-spacing:.04em; }
    .logo-text span { color:var(--red); }
    .logo-sub { font-size:11px; color:var(--text-faint); letter-spacing:.14em; text-transform:uppercase; margin-top:4px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 24px; }
    h1 { font-size:18px; font-weight:700; margin-bottom:4px; }
    p  { font-size:12px; color:var(--text-dim); margin-bottom:24px; }
    label { display:block; font-size:11px; font-weight:700; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
    input { display:block; width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:14px; color:var(--text); font-family:inherit; outline:none; margin-bottom:16px; transition:border-color .15s; }
    input:focus { border-color:var(--red); }
    input.error  { border-color:var(--danger); }
    .pw-wrap { position:relative; margin-bottom:16px; }
    .pw-wrap input { margin-bottom:0; padding-right:44px; }
    .pw-toggle { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-faint); padding:4px; font-size:16px; line-height:1; }
    .pw-toggle:hover { color:var(--text-dim); }
    .btn { display:block; width:100%; background:var(--red); color:#fff; border:none; border-radius:12px; padding:14px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; letter-spacing:.03em; transition:opacity .15s; }
    .btn:hover { opacity:.88; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    #errMsg { display:none; font-size:12px; color:var(--danger); text-align:center; margin-top:12px; line-height:1.5; }
    #successMsg { display:none; font-size:12px; color:var(--success); text-align:center; margin-top:12px; }
    .footer { text-align:center; margin-top:20px; font-size:11px; color:var(--text-faint); }
    .footer a { color:var(--text-dim); text-decoration:none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-text">SPHYNX <span>MOTION</span></div>
    <div class="logo-sub">Admin Portal</div>
  </div>

  <div class="card">
    <h1>Sign in to Admin</h1>
    <p>Admin and superadmin accounts only. Access is verified server-side.</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter admin email" autocomplete="username"
      onkeydown="if(event.key==='Enter')login()">

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()">
      <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()" aria-label="Show password" title="Show/hide password">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="btn" id="loginBtn" onclick="login()">Sign In →</button>

    <div id="errMsg"></div>
    <div id="successMsg">Signed in — redirecting…</div>
  </div>

  <div class="footer">
    <a href="/">← Back to SPHYNX MOTION</a>
  </div>
</div>

<script>
  // Auto-redirect if session cookie is already valid
  (async function checkSession() {
    try {
      const res = await fetch('/api/admin/auth/me', { credentials: 'include' });
      if (res.ok) {
        const okMsg = document.getElementById('successMsg');
        okMsg.textContent   = 'Already signed in — redirecting…';
        okMsg.style.display = 'block';
        setTimeout(() => { window.location.href = '/admin/dashboard'; }, 600);
      }
    } catch {}
  })();

  function togglePw() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eyeIcon');
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  const ERR_MAP = {
    401: 'Invalid email or password.',
    403: 'This account does not have admin access.',
    429: null, // use server message — "Too many login attempts…"
    503: 'Supabase is unavailable. Try again in a moment.',
    500: 'Server error. Please try again.',
  };

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const errMsg   = document.getElementById('errMsg');
    const okMsg    = document.getElementById('successMsg');

    errMsg.style.display = 'none';
    okMsg.style.display  = 'none';

    if (!email || !password) {
      showErr('Please enter your email and password.');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Signing in…';

    try {
      const res  = await fetch('/api/admin/auth/login', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'include',
        body:        JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        const mapped = ERR_MAP[res.status];
        showErr(mapped !== undefined && mapped !== null ? mapped : (data.error || 'Login failed. Please try again.'));
        return;
      }

      okMsg.style.display = 'block';
      setTimeout(() => { window.location.href = '/admin/dashboard'; }, 800);

    } catch {
      showErr('Unable to reach server. Make sure the backend is running.');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Sign In →';
    }
  }

  function showErr(msg) {
    const el   = document.getElementById('errMsg');
    const pwEl = document.getElementById('password');
    el.textContent   = msg;
    el.style.display = 'block';
    pwEl.classList.add('error');
    setTimeout(() => pwEl.classList.remove('error'), 2400);
  }
</script>
</body>
</html>
